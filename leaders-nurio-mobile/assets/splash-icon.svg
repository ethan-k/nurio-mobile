<?xml version="1.0" encoding="UTF-8"?>
<!-- Splash icon for the Android system splash screen.
     Canvas is 288x288 (the splash icon view size); the artwork stays inside the
     centred 192dp circle that androidx.core.splashscreen masks the icon with. -->
