version: "3"

vars:
  IOS_DIR: "{{.ROOT_DIR}}/ios"
  LEGACY_ANDROID_DIR: "{{.ROOT_DIR}}/android"
  STUDY_DIR: "{{.ROOT_DIR}}/study-nurio-mobile"
  TUTORS_ANDROID_DIR: "{{.ROOT_DIR}}/tutors-nurio-mobile/android"
  LEADERS_DIR: "{{.ROOT_DIR}}/leaders-nurio-mobile"
  LEADERS_ANDROID_DIR: "{{.LEADERS_DIR}}/android"
  LEADERS_IOS_DIR: "{{.LEADERS_DIR}}/ios"
  LEGACY_GRADLE_FILE: "{{.LEGACY_ANDROID_DIR}}/app/build.gradle.kts"
  TUTORS_GRADLE_FILE: "{{.TUTORS_ANDROID_DIR}}/app/build.gradle.kts"
  LEADERS_IOS_PROJECT: "{{.LEADERS_IOS_DIR}}/NurioStudyLeader.xcodeproj"
  LEADERS_IOS_SCHEME: "NurioStudyLeader"
  LEADERS_IOS_DESTINATION: "platform=iOS Simulator,name=iPhone 17"
  LEGACY_AAB_OUTPUT: "{{.LEGACY_ANDROID_DIR}}/app/build/outputs/bundle/release/app-release.aab"
  LEGACY_APK_OUTPUT: "{{.LEGACY_ANDROID_DIR}}/app/build/outputs/apk/debug/app-debug.apk"
  TUTORS_RELEASE_APK_OUTPUT: "{{.TUTORS_ANDROID_DIR}}/app/build/outputs/apk/release/app-release.apk"
  TUTORS_DEBUG_APK_OUTPUT: "{{.TUTORS_ANDROID_DIR}}/app/build/outputs/apk/debug/app-debug.apk"
  IOS_PROJECT: "{{.IOS_DIR}}/Nurio.xcodeproj"
  IOS_SCHEME: "Nurio"
  IOS_DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=18.2"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  ios:open:
    desc: Open the standalone Hotwire Native iOS project in Xcode
    cmds:
      - open {{.IOS_PROJECT}}

  ios:build:simulator:
    desc: Build the standalone Hotwire Native iOS shell for the default simulator
    cmds:
      - xcodebuild -project {{.IOS_PROJECT}} -scheme {{.IOS_SCHEME}} -destination '{{.IOS_DESTINATION}}' build

  ios:test:
    desc: Run the standalone Hotwire Native iOS shell unit tests
    cmds:
      - xcodebuild -project {{.IOS_PROJECT}} -scheme {{.IOS_SCHEME}} -destination '{{.IOS_DESTINATION}}' test

  ios:version:
    desc: Show iOS version (marketing and build numbers)
    cmds:
      - |
        BUILD=$(grep -A 20 "buildSettings = {" {{.IOS_PROJECT}}/project.pbxproj | grep "CURRENT_PROJECT_VERSION" | head -n 1 | sed 's/.*= \([^;]*\);.*/\1/' | tr -d ' ')
        MARKETING=$(grep -A 20 "buildSettings = {" {{.IOS_PROJECT}}/project.pbxproj | grep "MARKETING_VERSION" | head -n 1 | sed 's/.*= \([^;]*\);.*/\1/' | tr -d ' ')
        echo "Version: $MARKETING (build: $BUILD)"

  ios:version:bump:
    desc: Bump iOS build number for App Store Connect upload
    cmds:
      - ./scripts/bump-ios-version.sh build

  ios:version:bump:major:
    desc: Bump iOS major version and reset build (1.0.0 -> 2.0.0)
    cmds:
      - ./scripts/bump-ios-version.sh major

  ios:version:bump:minor:
    desc: Bump iOS minor version and reset build (1.0.0 -> 1.1.0)
    cmds:
      - ./scripts/bump-ios-version.sh minor

  ios:version:bump:patch:
    desc: Bump iOS patch version and reset build (1.0.0 -> 1.0.1)
    cmds:
      - ./scripts/bump-ios-version.sh patch

  ios:validate:
    desc: Check the Nurio app App Store Connect API key without building
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios validate

  ios:build:
    desc: Build the Nurio app signed App Store IPA (no upload)
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios build

  ios:beta:
    desc: Build and upload the Nurio app to TestFlight
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios beta

  ios:release:
    desc: Build and upload the Nurio app to App Store Connect for release review
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios release

  study:validate:
    desc: Check Study app store credentials for both platforms (iOS + Android)
    dir: "{{.STUDY_DIR}}"
    cmds:
      - task: study:ios:validate
      - task: study:android:validate

  study:ios:validate:
    desc: Check the Study app App Store Connect API key without building
    dir: "{{.STUDY_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios validate

  study:ios:build:
    desc: Build the Study app signed App Store IPA (no upload)
    dir: "{{.STUDY_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios build

  study:ios:beta:
    desc: Build and upload the Study app to TestFlight
    dir: "{{.STUDY_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios beta

  study:ios:release:
    desc: Build and upload the Study app to App Store Connect for release review
    dir: "{{.STUDY_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios release

  study:android:validate:
    desc: Check the Study app Play publisher service account without building
    dir: "{{.STUDY_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android validate

  study:android:build:
    desc: Build the Study app signed release AAB (no upload)
    dir: "{{.STUDY_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android build

  study:android:beta:
    desc: Build and upload the Study app AAB to the Play internal track
    dir: "{{.STUDY_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android beta

  study:android:promote:
    desc: Promote the Study app Play internal build to production
    dir: "{{.STUDY_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android promote

  android:validate:
    desc: Check the Nurio app Play publisher service account without building
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android validate

  android:build:
    desc: Build the Nurio app signed release AAB (no upload)
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android build

  android:build:debug:
    desc: Build debug APK for the Android app
    cmds:
      - task: legacy:build

  android:beta:
    desc: Build and upload the Nurio app AAB to the Play internal track
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android beta

  android:promote:
    desc: Promote the Nurio app Play internal build to production
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android promote

  android:build:release:apk:
    desc: Build release APK for the Android app without bumping version
    dir: "{{.LEGACY_ANDROID_DIR}}"
    preconditions:
      - sh: test -f {{.LEGACY_ANDROID_DIR}}/keystore.properties
        msg: "keystore.properties not found. See android/keystore.properties.example for format."
    cmds:
      - ./gradlew assembleRelease
      - echo "Release APK -> {{.LEGACY_ANDROID_DIR}}/app/build/outputs/apk/release/app-release.apk"

  android:version:
    desc: Show Android version
    cmds:
      - task: legacy:version

  android:version:bump:
    desc: Bump Android versionCode only (versionName unchanged)
    cmds:
      - ./scripts/bump-android-version.sh code

  android:version:bump:major:
    desc: Bump Android major version (1.0.0 -> 2.0.0) and increment versionCode
    cmds:
      - ./scripts/bump-android-version.sh major

  android:version:bump:minor:
    desc: Bump Android minor version (1.0.0 -> 1.1.0) and increment versionCode
    cmds:
      - ./scripts/bump-android-version.sh minor

  android:version:bump:patch:
    desc: Bump Android patch version (1.0.0 -> 1.0.1) and increment versionCode
    cmds:
      - ./scripts/bump-android-version.sh patch

  android:clean:
    desc: Clean Android build outputs
    cmds:
      - task: legacy:clean

  legacy:build:
    desc: Build debug APK for legacy Hotwire Android app
    dir: "{{.LEGACY_ANDROID_DIR}}"
    cmds:
      - ./gradlew assembleDebug
      - echo "Debug APK -> {{.LEGACY_APK_OUTPUT}}"

  legacy:version:
    desc: Show legacy Hotwire Android version
    cmds:
      - |
        CODE=$(sed -n 's/.*versionCode = \([0-9]*\)/\1/p' {{.LEGACY_GRADLE_FILE}})
        NAME=$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' {{.LEGACY_GRADLE_FILE}})
        echo "Version: $NAME (code: $CODE)"

  legacy:clean:
    desc: Clean legacy Hotwire Android build outputs
    dir: "{{.LEGACY_ANDROID_DIR}}"
    cmds:
      - ./gradlew clean

  tutors:build:
    desc: Build debug APK for the tutors Hotwire Android app
    dir: "{{.TUTORS_ANDROID_DIR}}"
    cmds:
      - ./gradlew assembleDebug
      - echo "Debug APK -> {{.TUTORS_DEBUG_APK_OUTPUT}}"

  tutors:lint:
    desc: Run lint for the tutors Hotwire Android app
    dir: "{{.TUTORS_ANDROID_DIR}}"
    cmds:
      - ./gradlew lintDebug

  tutors:build:release:
    desc: Build release APK for the tutors Hotwire Android app
    dir: "{{.TUTORS_ANDROID_DIR}}"
    preconditions:
      - sh: test -f {{.TUTORS_ANDROID_DIR}}/keystore.properties
        msg: "keystore.properties not found. Copy tutors-nurio-mobile/android/keystore.properties.example first."
    cmds:
      - ./gradlew assembleRelease
      - echo "Release APK -> {{.TUTORS_RELEASE_APK_OUTPUT}}"

  tutors:version:
    desc: Show tutors Hotwire Android version
    cmds:
      - |
        CODE=$(sed -n 's/.*versionCode = \([0-9]*\)/\1/p' {{.TUTORS_GRADLE_FILE}})
        NAME=$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' {{.TUTORS_GRADLE_FILE}})
        echo "Version: $NAME (code: $CODE)"

  tutors:clean:
    desc: Clean tutors Hotwire Android build outputs
    dir: "{{.TUTORS_ANDROID_DIR}}"
    cmds:
      - ./gradlew clean

  leaders:ios:build:
    desc: Build the Study Leader Hotwire Native iOS app
    cmds:
      - xcodebuild -project {{.LEADERS_IOS_PROJECT}} -scheme {{.LEADERS_IOS_SCHEME}} -destination '{{.LEADERS_IOS_DESTINATION}}' build

  leaders:ios:test:
    desc: Run the Study Leader iOS unit tests
    cmds:
      - xcodebuild -project {{.LEADERS_IOS_PROJECT}} -scheme {{.LEADERS_IOS_SCHEME}} -destination '{{.LEADERS_IOS_DESTINATION}}' test

  leaders:android:test:
    desc: Run the Study Leader Android unit tests
    dir: "{{.LEADERS_ANDROID_DIR}}"
    cmds:
      - ./gradlew :app:testDebugUnitTest

  leaders:android:build:
    desc: Build the Study Leader Android debug APK
    dir: "{{.LEADERS_ANDROID_DIR}}"
    cmds:
      - ./gradlew :app:assembleDebug

  leaders:android:lint:
    desc: Run Android lint for the Study Leader app
    dir: "{{.LEADERS_ANDROID_DIR}}"
    cmds:
      - ./gradlew :app:lintDebug

  leaders:validate:
    desc: Check Study Leader app store credentials for both platforms (iOS + Android)
    dir: "{{.LEADERS_DIR}}"
    cmds:
      - task: leaders:ios:validate
      - task: leaders:android:validate

  leaders:ios:validate:
    desc: Check the Study Leader app App Store Connect API key without building
    dir: "{{.LEADERS_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios validate

  leaders:ios:build:
    desc: Build the Study Leader app signed App Store IPA (no upload)
    dir: "{{.LEADERS_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios build

  leaders:ios:beta:
    desc: Build and upload the Study Leader app to TestFlight
    dir: "{{.LEADERS_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios beta

  leaders:ios:release:
    desc: Build and upload the Study Leader app to App Store Connect for release review
    dir: "{{.LEADERS_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane ios release

  leaders:android:validate:
    desc: Check the Study Leader app Play publisher service account without building
    dir: "{{.LEADERS_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android validate

  leaders:android:build:
    desc: Build the Study Leader app signed release AAB (no upload)
    dir: "{{.LEADERS_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android build

  leaders:android:beta:
    desc: Build and upload the Study Leader app AAB to the Play internal track
    dir: "{{.LEADERS_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android beta

  leaders:android:promote:
    desc: Promote the Study Leader app Play internal build to production
    dir: "{{.LEADERS_DIR}}"
    cmds:
      - mise exec ruby -- ruby -S bundle exec fastlane android promote
